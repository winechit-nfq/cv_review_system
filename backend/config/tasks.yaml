technical_architecture_review_task:
  description: >
    Review the CV of candidate "{cv_name}" to evaluate their architectural expertise and system design capabilities against the requirements in: "{job_description}".
    Analyze their technical experience from the CV:
    ---
    {cv_text}
    ---
    Focus on distributed systems experience, cloud architecture knowledge, scalability solutions, and technical decision-making capabilities.
    Your architectural assessment will be crucial for the senior technical reviewer's final evaluation.
  expected_output: >
    **Final Assessment**:
    - Candidate Fit Score: [X/100]
      * Technical Skills: [X/40]
      * Experience: [X/30]
      * Role Alignment: [X/30]
    
    - Recommendation: [Strong Hire/Hire/Maybe/No Hire]
      * Confidence Level: [High/Medium/Low]
      * Risk Level: [Low/Medium/High]
    
    - Executive Summary:
      * Key Strengths: [Top 3 standout qualities]
      * Growth Areas: [Up to 3 development needs]
      * Interview Focus: [Key areas to probe]
      * Cultural Fit: [Team/company culture alignment]
  agent: technical_architect_agent

