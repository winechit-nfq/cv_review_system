software_engineer_cv_review_task:
  description: >
    Perform a comprehensive final assessment of candidate "{cv_name}" for the software engineering position described in: "{job_description}".
    
    Step 1: Analyze the CV for evidence of technical expertise, including:
    ---
    {cv_text}
    ---
    - Programming languages, frameworks, and tools proficiency
    - Project experience and problem-solving capabilities
    - Architectural thinking and system design skills
    
    Step 2: Synthesize insights from the three specialist reviewers:
    1. Technical Architecture reviewer: system design, scalability, and architectural decision-making
    2. Engineering Practice reviewer: development methodologies, code quality, testing, and CI/CD
    3. Team Leadership reviewer: technical mentorship, team impact, and engineering culture
    
    Integrate these perspectives to deliver a holistic evaluation of the candidate’s strengths, gaps, and growth potential. Highlight alignment with the role’s requirements and readiness for success.
  expected_output: >
    **Final Assessment**:
    - Candidate Fit Score: [X/100]
      * Technical Skills: [X/40]
      * Experience: [X/30]
      * Role Alignment: [X/30]
    
    - Recommendation: [Strong Hire/Hire/Maybe/No Hire]
      * Confidence Level: [High/Medium/Low]
      * Risk Level: [Low/Medium/High]
    
    - Executive Summary:
      * Key Strengths: [Top 3 standout qualities]
      * Growth Areas: [Up to 3 development needs]
      * Interview Focus: [Key areas to probe]
      * Cultural Fit: [Team/company culture alignment]
  agent: software_engineer_agent